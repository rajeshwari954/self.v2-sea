<style>
:root{--bg:#FAF6E9;--card:#FFFDF5;--tx:#36393C;--mu:#6B6F72;--bd:rgba(89,91,94,.16);--ds:#C3BCA8;--ac:#4F6C8D;--hd:#595B5E;--hdt:#F2EFE9;--err:#A5614F;--errbg:#F6E3DC;--vc:rgba(95,122,153,.25);--rad:24px;
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;--sans:Marcellus,Georgia,serif;--on:#fff;--good:#6B7357;--dock:#595B5E;--dock-tx:#D9D6CC;--dock-on:#F2EFE9;--dock-on-tx:#33383D;--toast:#595B5E;--toast-tx:#F2EFE9;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17191B;--card:#232629;--tx:#ECE9E1;--mu:#A4A9AD;--bd:rgba(255,255,255,.13);--ds:#5A6065;--ac:#8DA1BA;--hd:#ECE9E1;--hdt:#17191B;--err:#E39A86;--errbg:#3B2824;--vc:rgba(141,161,186,.3);--on:#14171A;--good:#9DB88F;--dock:#34383C;--dock-tx:#BFC3C6;--dock-on:#ECE9E1;--dock-on-tx:#17191B;--toast:#ECE9E1;--toast-tx:#17191B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17191B;--card:#232629;--tx:#ECE9E1;--mu:#A4A9AD;--bd:rgba(255,255,255,.13);--ds:#5A6065;--ac:#8DA1BA;--hd:#ECE9E1;--hdt:#17191B;--err:#E39A86;--errbg:#3B2824;--vc:rgba(141,161,186,.3);--on:#14171A;--good:#9DB88F;--dock:#34383C;--dock-tx:#BFC3C6;--dock-on:#ECE9E1;--dock-on-tx:#17191B;--toast:#ECE9E1;--toast-tx:#17191B;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.35 var(--sans);min-height:100vh;min-height:100dvh;-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom,0px) + 120px) max(16px,env(safe-area-inset-left))}
button,input,textarea{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
h1,h2{font-family:var(--serif);font-weight:500;margin:0;line-height:1.1}
h1{font-size:34px}h1 i{font-style:italic}h2{font-size:26px;font-style:italic}
.eb,.sl,.lbl{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--mu)}
.sl{margin:16px 0 10px}
.hr{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:4px 0 14px}
.cnt{background:var(--card);border:1px solid var(--bd);border-radius:var(--rad);padding:8px 14px;text-align:center;min-width:76px}
.cnt b{display:block;font:500 26px/1.1 var(--serif)}.cnt span{font-size:11px;color:var(--mu)}
.pl{display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.pl button{min-height:44px;padding:0 18px;border-radius:14px;border:1px solid var(--bd);background:var(--card);font-size:14px}

.note{font-size:13px;color:var(--mu);margin:8px 0}
.banner{border-radius:14px;padding:12px 14px;font-size:14px;background:var(--errbg);margin:8px 0}
.linkbtn{background:none;border:0;padding:0;text-decoration:underline;font-size:13px;color:var(--mu)}
.two{display:block}
.gt{display:grid;gap:8px;grid-template-columns:repeat(var(--c,5),minmax(0,1fr))}
.c2{--c:2}.c3{--c:3}.c4{--c:4}.c5{--c:5}
.sq{aspect-ratio:1;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:10px 10px 9px;border-radius:var(--rad);background:var(--card);border:1.5px solid var(--bd);color:var(--tx);text-align:left;min-width:0;-webkit-user-select:none;user-select:none}
.sq b{font-weight:400;font-size:12.5px;line-height:1.15}
.sq .n{font:500 26px/1 var(--serif);font-style:normal}
.sq span{font-size:10px;color:var(--mu);letter-spacing:.04em}
.nb{display:flex;align-items:baseline;gap:3px}
.sq[aria-pressed="true"],.sq.on{border-color:transparent}
.sq[aria-pressed="true"] span,.sq.on span{color:inherit;opacity:.85}
.sq:disabled{opacity:.55}
.sq.busy{opacity:.6}
.sq.dtp{align-items:center;justify-content:center;text-align:center;padding:6px}.sq.dtp b{font-size:11px}
.sq.stat{align-items:center;justify-content:center;text-align:center;gap:2px;padding:4px;border-style:solid}
.sq.stat b{font:500 19px/1.1 var(--serif)}.sq.stat span{font-size:9px;letter-spacing:.05em;text-transform:uppercase}
.gp{background:rgba(148,171,140,.17);border-radius:var(--rad);padding:4px 12px 12px;margin-bottom:10px;container-type:inline-size}
.gp .sl{margin:10px 0 8px}.gp .sq{aspect-ratio:1.5;border-style:dashed;border-color:var(--ds)}
.gp .sq[aria-pressed="true"]{border-style:solid}
@container (min-width:340px){.gp .gt.c2{--c:4}.gp .sq{aspect-ratio:1}}
.loc{margin-top:10px}
input,textarea{font-size:16px;border-radius:12px;border:1px solid var(--bd);background:var(--card);padding:0 14px;min-height:48px;width:100%;min-width:0}
textarea{padding:12px 14px;min-height:80px;resize:vertical}
input:focus,textarea:focus{border-color:var(--ac)}
.cd{background:var(--card);border:1px solid var(--bd);border-radius:var(--rad);padding:14px;margin-bottom:12px}
.cd .sl{margin:0 0 10px}
.cf{display:grid;grid-template-columns:1fr;gap:10px;margin-top:16px}
.cf .cd{margin:0}
.scale{display:flex;gap:6px}
.scale button{flex:1;min-width:0;min-height:44px;aspect-ratio:1;border-radius:12px;border:1px solid var(--bd);background:transparent;font-size:14px;padding:0}
.scale button[aria-pressed="true"]{border-color:transparent;color:#F6F5F2}
.ad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ad button{border:0;border-radius:var(--rad);aspect-ratio:1.15;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:14px;color:var(--tx)}
.ad small{font-size:10px;color:var(--mu);letter-spacing:.03em}
.en{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-left-width:6px;border-radius:16px;padding:10px 12px;margin-bottom:8px}
.en>div{flex:1;min-width:0}.en small{display:block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mu)}
.en p{margin:2px 0 0;font-size:15px;overflow-wrap:anywhere}
.em{color:var(--mu);margin:0 0 6px;font-size:14px}
.xb{background:none;border:0;color:var(--mu);font-size:22px;min-width:44px;min-height:44px;font-family:inherit}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--mu);margin-top:26px}
.tr{display:grid;grid-template-columns:56px 1fr 44px;gap:8px;align-items:center;margin-bottom:8px}
.tr small{font-size:11px;color:var(--mu);text-align:right;line-height:1.3}
.bc{border-radius:14px;padding:8px 12px}.bc .n{font-size:14px}.bc .s{font-size:12px;opacity:.8}.bc.dn{opacity:.5}.bc.dn .n{text-decoration:line-through}
.ck{background:none;border:0;font-size:22px;color:var(--mu);min-width:44px;min-height:44px;padding:0}.ck.on{color:var(--good)}
.lg2{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--mu);margin:0 0 8px}
.lg2 i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-2px}
.hint{font-size:12px;color:var(--mu);margin:0 0 10px}
.td{display:flex;align-items:center;gap:4px;padding:2px 0;border-top:1px solid var(--bd)}.td .n{flex:1;min-width:0;overflow-wrap:anywhere}.td.dn .n{text-decoration:line-through;color:var(--mu)}
.bell{font-size:12px;color:var(--ac)}
.primary{min-height:52px;border-radius:14px;border:0;background:var(--ac);color:var(--on);font-size:15px;letter-spacing:.1em;text-transform:uppercase;width:100%}
.primary:disabled{opacity:.6}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.top button{width:44px;height:44px;border-radius:14px;border:1px solid var(--bd);background:var(--card);font-size:18px}
.big{font:italic 500 34px/1.1 var(--serif)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dw{text-align:center;font-size:11px;color:var(--mu);margin-bottom:4px}
.cc{aspect-ratio:1;border-radius:14px;border:1px solid var(--bd);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 0 7px;font:500 14px var(--serif);color:var(--tx)}
.cc.vc{background:var(--vc)}.cc.tdy{outline:2px solid var(--ac)}.cc.sel{border-color:var(--ac)}
.dts{display:flex;gap:3px;height:6px}.dts i{width:6px;height:6px;border-radius:50%}
.cr{display:grid;grid-template-columns:92px 1fr 78px;gap:8px;align-items:center;font-size:13px;margin:7px 0}
.bar{height:10px;border-radius:5px}
.ex{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--bd);padding:2px 0}.ex>div{min-width:0;overflow-wrap:anywhere}.ex small{display:block;color:var(--mu);font-size:11px}
.bars{display:flex;gap:6px;height:120px;align-items:stretch}.bars.dense{gap:2px}
.bcol{flex:1;display:flex;flex-direction:column;min-width:0}.bw{flex:1;display:flex;align-items:flex-end}
.bw i{display:block;width:100%;border-radius:8px 8px 3px 3px}.dense .bw i{border-radius:3px 3px 1px 1px}
.bcol span{font-size:10px;color:var(--mu);text-align:center;height:14px;margin-top:4px;white-space:nowrap}
.hg,.hb{display:grid;grid-template-columns:92px 1fr 44px;gap:8px;align-items:center;font-size:13px;margin:7px 0}
.hg div{display:flex;gap:5px}.hg i{width:20px;height:20px;border-radius:7px;border:1.5px dashed var(--ds)}.hg i.on{border:0}.hg i.ft{opacity:.35}
.hg b,.hb b{font-weight:400;text-align:right;color:var(--mu)}
.trk{height:10px;border-radius:5px;background:var(--bd)}.trk i{display:block;height:100%;border-radius:5px}
/* dock */
.nv{display:flex;gap:4px;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:12;background:var(--dock);border-radius:28px;padding:8px;width:min(94vw,440px)}
.nv button{flex:1;display:flex;align-items:center;justify-content:center;min-height:44px;border:0;border-radius:16px;padding:9px 2px;background:transparent;color:var(--dock-tx);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase}
.nv button[aria-current="page"]{background:var(--dock-on);color:var(--dock-on-tx)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(30,28,24,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:92vh;max-height:92dvh;overflow-y:auto;background:var(--card);border-radius:22px 22px 0 0;padding:12px 18px calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;flex-direction:column;gap:16px;max-width:520px;margin:0 auto}
.grab{width:40px;height:4px;border-radius:4px;background:var(--bd);align-self:center}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.field{display:flex;flex-direction:column;gap:6px}
.field input[inputmode="decimal"],.field input[type="time"],.field input[type="date"]{font-family:var(--sans)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-height:42px;padding:0 14px;border-radius:99px;border:1px solid var(--bd);background:transparent;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--ac);color:var(--on);border-color:var(--ac)}
.opt{background:rgba(148,171,140,.17);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.links{font-size:13px;color:var(--mu)}.links b{color:var(--tx);font-weight:400}
.err{color:var(--err);font-size:14px}
[hidden]{display:none!important}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 86px);z-index:30;background:var(--toast);color:var(--toast-tx);padding:12px 18px;border-radius:14px;font-size:14px;max-width:calc(100% - 36px);box-shadow:0 6px 20px rgba(0,0,0,.18)}
.toast.bad{background:var(--err);color:var(--on)}
.gate{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:16px}
@media (prefers-reduced-motion:no-preference){.sq,.ad button,.pl button,.nv button,.cc{transition:transform .12s ease,background-color .12s ease,border-color .12s ease}.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}}
@media (hover:hover){.sq:not(.stat):not(:disabled):hover{transform:translateY(-2px);border-color:var(--ac)}.ad button:hover{transform:translateY(-2px)}.pl button:hover,.top button:hover,.cc:hover{border-color:var(--ac)}.nv button:hover{background:rgba(255,255,255,.12)}.nv button[aria-current="page"]:hover{background:var(--dock-on)}.xb:hover{color:var(--err)}}
@media (min-width:600px){.wrap{max-width:860px}h1{font-size:40px}}
@media (min-width:760px){.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 24px;align-items:start}
  .sheet{top:50%;bottom:auto;left:50%;right:auto;transform:translate(-50%,-50%);width:520px;border-radius:24px;max-height:82vh;max-height:82dvh}@media (prefers-reduced-motion:no-preference){.sheet{animation:none}}}
@media (min-width:900px){.gt.stats{--c:8}}
@media (min-width:1000px){body{padding-left:252px}.wrap{max-width:1080px;padding-top:calc(env(safe-area-inset-top,0px) + 22px)}h1{font-size:44px}
  .nv{left:16px;top:16px;bottom:16px;transform:none;width:220px;flex-direction:column;justify-content:flex-start;border-radius:26px;padding:22px 10px 16px;gap:4px}
  .nv::before{content:"self.v2";font:italic 500 26px var(--serif);color:var(--dock-on);padding:0 14px 18px}
  .nv button{flex:none;justify-content:flex-start;font-size:12px;letter-spacing:.14em;padding:13px 14px;border-radius:14px;text-align:left}
  .toast{bottom:24px}}
@media (min-width:1000px) and (hover:hover){.nv::after{content:"Keys 1–5 switch tabs · Esc closes";margin-top:auto;font-size:10px;letter-spacing:.06em;color:#A9A79D;padding:0 14px}}
</style>

    form.querySelectorAll('[data-pick]').forEach(function(g){
      if (g.closest('[data-when][hidden]')) return;
      var on = g.querySelectorAll('[aria-pressed="true"]'); if (!on.length) return;
      if (g.dataset.multi === '1'){ fields[g.dataset.pick] = Array.prototype.map.call(on, function(b){ return b.dataset.val; }); return; }
      var one = on[0];
      if (one.dataset.other){ var o = form.querySelector('[data-other-for="' + g.dataset.pick + '"]'); if (o && o.value.trim()) fields[g.dataset.pick] = o.value.trim().replace(',', '.'); }
      else fields[g.dataset.pick] = one.dataset.val;
    });
    var missing = [];
    F.fields.forEach(function(f){ var all = f.row || [f]; all.forEach(function(x){ if (x.req && !fields[x.k] && !(f.when && form.querySelector('[data-when="' + f.when + '"]').hidden)) missing.push(x.label.replace(/[?·].*$/,'').trim()); }); });
    if (kind === 'hobby' && !fields.hobby) missing.push('which hobby');
    if (kind === 'plan' && pickedType(form) !== 'To-do' && (!fields.start || !fields.end)) missing.push('a start and finish time');
    if (missing.length){ errEl.hidden = false; errEl.textContent = 'Add ' + missing.join(' and ').toLowerCase() + ' first.'; return; }
    errEl.hidden = true; btn.disabled = true; btn.textContent = 'Saving…';
    var day = S.day, req;
    if (kind === 'plan'){
      var ty = pickedType(form);
      req = ty === 'To-do' ? api('todo', {day: day, title: fields.title, time: fields.remind, category: fields.category, notes: fields.notes})
                           : api('block', {day: day, title: fields.title, kind: ty, category: fields.category, start: fields.start, end: fields.end});
    } else if (kind === 'expense') req = api('expense', {item: fields.item, amount: fields.amount, category: fields.category, date: fields.date, notes: fields.notes});
    else req = api('log', {day: day, kind: kind, fields: fields});
    req.then(function(r){
      var d = S.data && S.data.day === day ? S.data : null;
      if (kind === 'plan' && d){ if (r.todo){ d.todos.push(r.todo); } else if (r.block){ d.blocks.push(r.block); } }
      else if (kind !== 'expense' && kind !== 'plan' && d){ d.entries.push(r.entry); if (r.checkin) d.checkin = r.checkin; }
      invalidate(); closeSheet(); render(); toast('Saved to ' + F.target);
      if (kind === 'expense') ensureTab();
    }, function(e){
      if (e.code === 'network'){
        // We can't tell whether Notion got it. Re-read the day before letting a second save happen.
        closeSheet(); toast("Couldn't confirm that save. Check the list before adding it again.", true); refresh(); ensureTab();
      } else { btn.disabled = false; btn.textContent = F.save; errEl.hidden = false; errEl.textContent = e.message; }
    });
  });

  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible' && S.pass){
      var t = istDay();
      if (t !== today){ today = t; yesterday = addDays(t,-1); S.day = istHour() < 4 ? yesterday : today; S.ym = today.slice(0,7); }
      invalidate(); refresh(); ensureTab();
    }
  });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(function(){});
  if (S.pass) refresh(); else render();
})();
</script>
